{{if .Books}}
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                {{range .Books}}
                <div class="col">
                    <div class="card card-book h-100">
                        <div class="card-body">
                            <h5 class="card-title">{{.Title}}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">
                                <i class="fas fa-user-edit me-1"></i>{{.Author}}
                            </h6>
                            <p class="card-text">{{.Description}}</p>
                            <small class="text-muted">
                                <i class="far fa-calendar-alt me-1"></i>{{.CreatedAt}}
                            </small>
                        </div>
                        <div class="card-footer bg-transparent border-top-0 d-flex justify-content-end">
                            <a href="#" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                        </div>
                    </div>
                </div>
                {{end}}
            </div>
        {{else}}
            <div class="alert alert-info text-center">
                <i class="fas fa-info-circle me-2"></i>No books available yet. Check back later!
            </div>
        {{end}}

        <!-- ===== FORM / REGISTER LINKS (preserved from original) ===== -->
        <div class="mt-5 p-4 bg-white rounded shadow-sm">
            <h5><i class="fas fa-link me-2"></i>Quick Links</h5>
            <ul class="list-inline">
                <li class="list-inline-item"><a href="/form" class="btn btn-outline-secondary btn-sm">Go to Form</a></li>
                <li class="list-inline-item"><a href="/form/register" class="btn btn-outline-primary btn-sm">Register</a></li>
            </ul>
            <p class="text-muted small mt-2">Powered By <a href="https://github.com/L0rd5n0w">Parzival </a>& <a href="https://golang.org">GO</a></p>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <div class="container">
            &copy; 2026 Newstore. All rights reserved.
        </div>
    </div>

    <!-- Bootstrap JS (optional, for any toggles) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
