<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newstore – Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-store me-2"></i>Newstore
            </a>
            <div class="ms-auto">
                <a href="/form/register" class="btn btn-outline-light me-2">
                    <i class="fas fa-user-plus me-1"></i>Register
                </a>
                <a href="/form/login" class="btn btn-light">
                    <i class="fas fa-sign-in-alt me-1"></i>Login
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 700px;">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title">{{.Title}}</h2>
                    <h5 class="card-subtitle mb-2 text-muted">
                        <i class="fas fa-user-edit me-2"></i>{{.Author}}
                    </h5>
                    <p class="card-text mt-3">{{.Description}}</p>
                    <hr>
                    <small class="text-muted">
                        <i class="far fa-calendar-alt me-2"></i>Added on {{.CreatedAt}}
                    </small>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-1"></i>Back
                    </a>
                    <div>
                        <a href="/form/update/{{.ID}}" class="btn btn-primary me-2">
                            <i class="fas fa-edit me-1"></i>Edit
                        </a>
                        <!-- DELETE BUTTON with confirmation -->
                        <form action="/book/delete/{{.ID}}" method="POST" style="display: inline;" 
                              onsubmit="return confirm('Are you sure you want to delete this book?');">
                            <input type="hidden" name="id" value="{{.ID}}">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash-alt me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
    </div>

</body>
</html>
